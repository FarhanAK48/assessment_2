

<div class="table-wrap">
  <table class="summary-table">
    <caption class="sr-only">{{ caption }}</caption>

    <thead>
      <tr>
        <th scope="col">Metric</th>
        <th scope="col" class="num">Target</th>
        <th scope="col" class="num">Actual</th>
        <th scope="col" class="num">Variance</th>
        <th scope="col" class="num">Variance %</th>
        <th scope="col">Status</th>
      </tr>
    </thead>

    <tbody>
      <tr *ngFor="let row of rows; trackBy: trackByKey" [attr.data-key]="row.key">
        <th scope="row" data-label="Metric">
          {{ row.label }}
        </th>

        <td class="num" data-label="Target">
          {{ value(row, row.target) }}
        </td>

        <td class="num" data-label="Actual">
          {{ value(row, row.actual) }}
        </td>

        <!-- green = favorable, red = unfavorable, grey = exact zero -->
        <td class="num" data-label="Variance" [ngClass]="row.status">
          {{ variance(row) }}
        </td>

        <td class="num" data-label="Variance %" [ngClass]="pctClass(row)">
          {{ variancePct(row) }}
        </td>

        <td data-label="Status">
          <span
            class="status-indicator"
            [ngClass]="'status-' + row.status"
            [attr.aria-label]="row.status"
            [title]="row.status | titlecase"
          >
            <ng-container [ngSwitch]="row.status">
              <svg
                *ngSwitchCase="'favorable'"
                class="status-icon"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2.5"
                aria-hidden="true"
              >
                <path d="M5 12.5l4.5 4.5L19 7" stroke-linecap="round" stroke-linejoin="round" />
              </svg>

              <svg
                *ngSwitchCase="'unfavorable'"
                class="status-icon"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2.5"
                aria-hidden="true"
              >
                <path d="M18 6L6 18M6 6l12 12" stroke-linecap="round" stroke-linejoin="round" />
              </svg>

              <svg
                *ngSwitchDefault
                class="status-icon"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2.5"
                aria-hidden="true"
              >
                <path d="M6 12h12" stroke-linecap="round" />
              </svg>
            </ng-container>

            <span class="status-text">
              {{ row.status | titlecase }}
            </span>
          </span>
        </td>
      </tr>
    </tbody>
  </table>
</div>
